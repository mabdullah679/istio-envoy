# Sized from measurement on 2 x t3.medium (see README "Design decisions"); chart defaults ask for 2 GiB.
pilot:
  autoscaleEnabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
global:
  proxy:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
